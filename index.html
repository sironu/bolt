<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>BOLTCLONE</title>
</head>

<body>

    <div id="map">
        <img src="./Images/main_page_bg.png" alt="">
    </div>

    <!-- Top Navigation Card -->
    
    <div class="top-card">
        <img class="top-arrow-img" src="./Images/navigation.png" alt="Navigation Arrow">
    </div>



    <!-- Left Controls -->

    <div class="left-controls">
        <button>🔇</button>
        <button>⤴</button>
        <button>⚠</button>
    </div>

    <!-- Right Controls -->

    <div class="right-controls">
        <button>G</button>
        <button>💬</button>
        <button>🧾</button>
    </div>

    <!--  Bottom Sheet -->
    <div class="bottom-sheet">

        <div class="time">
            <h2>1 min</h2>
            <p>
                Domestic Flight Terminal,<br>
                Abuja Nnamdi Azikiwe Airport (ABV)
            </p>

            <span>Domestic Flights</span>

            <h3>Max ⭐ 5.0</h3>

        </div>

        <button class="arrived">
            Arrived
        </button>

    </div>

    <script src="./script.js"></script>


</body>

</html>

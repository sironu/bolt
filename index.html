<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>.</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  
    <!-- <div>
        <i class="fa-solid fa-volume"></i>
    </div> -->
</head>

<body>

    <main>

       

        <!-- Top Navigation Card -->

        <div class="top-card">
            <img style="border-radius: 15px;" src="./Images/navigation.png" alt="Navigation Arrow">
        </div>

         <div id="map">
            <img src="./Images/landingPage.png" alt="">
        </div>



        <!-- Left Controls -->

        <div class="left-controls">
          

            
            <button>
                <img class="img_left" height="45" width="45" src="./Images/mute.jpeg" alt="">
                
            </button>
            <button>
                <img class="img_left" height="45" width="45" src="./Images/y-junction.jpeg" alt="">
                
            </button>
            <button>
                <img class="img_left" height="45" width="45" src="./Images/exclamation.jpeg" alt="">
                
            </button>
        </div>

        <!-- Right Controls -->

        <div class="right-controls">
            <button>
                <img class="img_right" height="55" width="55" src="./Images/google.jpeg" alt="">
                
            </button>
            <button>
                <img class="img_right" height="55" width="55" src="./Images/app_msg.jpeg" alt="">
                
            </button>

            <button>
                <img class="img_right" height="55" width="55" src="./Images/msg.jpeg" alt="">
                
            </button>
           

           
        </div>

        <!--  Bottom Sheet -->
        <div class="bottom-sheet">

            <div class="time">
                <h2 style="padding-bottom: 3px;">1 min</h2>


                <p style="padding-bottom: 3px;">
                    Domestic Flight Terminal,<br>
                    Abuja Nnamdi Azikiwe Airport (ABV)
                </p>




                <span style="padding-bottom: 3px;">Domestic Flights</span>
                <br>

                <h3>Max ⭐ 5.0</h3>

            </div>

            <button class="arrived">
                Arrived
            </button>

        </div>

        <script src="./script.js"></script>


    </main>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>.</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>

<body>
  <main>
    <!-- Top Navigation Card -->
    <div class="top-card changeState">
      <img src="./Images/navigation.png" alt="Navigation Arrow">
    </div>

    <div class="map">
      <p>
        <img class="landingPageImg" src="./Images/landingPage.png" alt="map-img">
        <img src="./Images/LpageImg2.png" alt="map-img">
        <img src="./Images/LpageImg1.png" alt="map-img">
        <img src="./Images/LpageImg.png" alt="map-img">
      </p>
    </div>



    <!-- Left Controls -->

    <div class="left-controls">
      <img class="changeState" src="./Images/mute.jpeg" alt="">
      <img class="changeState" src="./Images/y-junction.jpeg" alt="">
      <img class="changeState" src="./Images/exclamation.jpeg" alt="">
    </div>

    <!-- Right Controls -->

    <div class="right-controls">
      <img class="changeState" src="./Images/google.jpeg" alt="">
      <img class="changeState" src="./Images/app_msg.jpeg" alt="">
      <img class="changeState" src="./Images/msg.jpeg" alt="">
    </div>


    <!-- ================= BOTTOM TRIP PANEL ================= -->
    <div class="trip-panel changeState">
      <div class="drag-handle"></div>

      <div class="trip-top">

        <div class="trip-info">

          <div class="time-menu">
            <div class="time">
              1 min
            </div>
            <i class="fa-solid fa-list kebab menu"></i>
          </div>

          <div class="destination">
            Domestic Flight Terminal, <br /> Abuja Nnamdi Azikiwe Airport (ABV)
          </div>
          <div class="fare">

            Domestic Flights
          </div>

          <div class="driver first-rider">
            Chioma ⭐ 5.0
          </div>

          <!-- <div class="fare">
            <span class="old-price">₦20,319.77</span>
            · ₦2,000.00 toll
            · Net, tax incl.
          </div>

           -->

        </div>



      </div>

      <button class="arrived">


        <i class="arrived-arrow fa-solid fa-angles-right text-white"></i>
        <p style="margin-right: 2.5rem;">Arrived</p>
        <span></span>


      </button>

    </div>

    <div class="recenter none">
      <div class="recenterFlex">
        <i class="fa-solid fa-location-arrow fa-rotate-by" style="--fa-rotate-angle: -45deg;"></i>
        <span>Recenter</span>
      </div>

    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="Jscript/app.js"></script>
  <script src="./script.js"></script>
</body>

</html>
